<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>换个技能</title><style>body{margin:0;background:#f6f5ef;color:#24372d;font:16px Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;color:#285c43;font-weight:bold}button{border:0;border-radius:8px;padding:12px 18px;background:#285c43;color:white;cursor:pointer}.hero{margin:30px 0;padding:40px;background:#e0ebd9;border-radius:18px;display:flex;justify-content:space-between;align-items:center}.hero h1{font:42px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #e7e9e2;border-radius:13px;padding:20px}.tag{display:inline-block;background:#edf3e9;color:#37654a;padding:7px;border-radius:6px;margin:6px 3px}.muted{color:#89938a;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding:24px}.hero h1{font-size:30px}}</style><div class="wrap"><header class="head"><div class="logo">✳ 换个技能</div><button onclick="publish()">＋ 发布技能</button></header><section class="hero"><div><small>SKILL SWAP COMMUNITY</small><h1>用你的擅长，交换<br>下一种热爱。</h1><p>教会一个人你会的，遇见一个人想学的。</p><button onclick="document.querySelector('#people').scrollIntoView()">寻找交换伙伴　→</button></div><div style="font-size:70px">🎸 📷</div></section><h2 id="people">本周推荐伙伴</h2><p>你教会的，正是别人想学的。</p><input id="q" placeholder="搜索技能或城市" oninput="draw()" style="padding:12px;border:1px solid #ddd;border-radius:8px"><div class="grid" id="cards"></div><p style="text-align:center;color:#89938a">发布技能 · 智能匹配 · 发起互换 · 一起成长</p></div><script>let a=[['林檬','上海','产品设计师','UI设计','日语','你教她 Python，交换 UI设计'],['阿哲','杭州','摄影师','摄影','吉他','你教他 英语，交换 摄影'],['Mia','远程','英语教师','英语口语','烘焙','你教她 烘焙，交换 英语口语'],['小周','上海','工程师','Python','摄影','你教他 摄影，交换 Python'],['安然','苏州','视觉设计师','品牌设计','咖啡','你教她 咖啡，交换 品牌设计'],['嘉木','南京','音乐爱好者','吉他','英语','你教他 英语，交换 吉他']];function draw(){let q=document.querySelector('#q').value.toLowerCase();document.querySelector('#cards').innerHTML=a.filter(x=>x.join(' ').toLowerCase().includes(q)).map((x,i)=>'<article class="card"><h3>◉ '+x[0]+' · '+x[1]+'</h3><p class="muted">'+x[2]+'</p><span class="tag">可教 '+x[3]+'</span><span class="tag">想学 '+x[4]+'</span><p>'+x[5]+'</p><p class="muted">每周都可以约时间，一起练习和成长。</p><button onclick="invite(''+x[0]+'')">发起交换　→</button></article>').join('')}function invite(n){alert('已向 '+n+' 发送技能交换邀请！')}function publish(){let s=prompt('你擅长什么技能？');if(s){a.unshift(['你','本地','新伙伴',s,'待匹配','技能已发布，等待匹配']);draw();alert('发布成功！')}}draw();</script></html>
